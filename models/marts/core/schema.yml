version: 2

models:
  - name: fct_product_metrics_daily
    description: >
      [Definition] The product-level fact table aggregating activity across ALL accounts.
      [Context] Use this table for high-level reporting (e.g., Investor Updates, Board Slides).
      It removes double-counting of users who belong to multiple accounts.
    columns:
      - name: metric_date
        tests: [not_null, unique]
        description: >
          [Definition] The calendar date for the row.
          [Formula] Derived from the Date Spine.
          [Context] All metrics reflect activity on or leading up to this date.

      # --- USER METRICS ---
      - name: dau
        description: >
          [Definition] Global Daily Active Users. Unique humans active today.
          [Formula] COUNT(DISTINCT user_id) where event_date = metric_date.
          [Context] The baseline pulse of your product's daily usage.
      - name: wau
        description: >
          [Definition] Global Weekly Active Users. Unique humans active in last 7 days.
          [Formula] COUNT(DISTINCT user_id) where event_date > (metric_date - 7 days).
          [Context] Useful for products with a weekly usage cadence.
      - name: mau
        description: >
          [Definition] Global Monthly Active Users. Unique humans active in last 30 days.
          [Formula] COUNT(DISTINCT user_id) where event_date > (metric_date - 30 days).
          [Context] The standard measure of total user base size.

      # --- ACCOUNT METRICS ---
      - name: daa
        description: >
          [Definition] Global Daily Active Accounts. Unique companies active today.
          [Formula] COUNT(DISTINCT account_id) where event_date = metric_date.
          [Context] Tracks daily logo engagement. Critical for B2B.
      - name: waa
        description: >
          [Definition] Global Weekly Active Accounts. Unique companies active in last 7 days.
          [Formula] COUNT(DISTINCT account_id) where event_date > (metric_date - 7 days).
          [Context] Smooths out daily volatility (like weekends) for account activity.
      - name: maa
        description: >
          [Definition] Global Monthly Active Accounts. Unique companies active in last 30 days.
          [Formula] COUNT(DISTINCT account_id) where event_date > (metric_date - 30 days).
          [Context] The best proxy for "Total Active Customer Base" or "Retained Logos".

      # --- RATIOS ---
      - name: user_stickiness_ratio
        description: >
          [Definition] Global User Habit Score.
          [Formula] DAU / MAU.
          [Context] Measures how habit-forming the product is. >20% is good for B2B.
      - name: account_stickiness_ratio
        description: >
          [Definition] Global Account Habit Score.
          [Formula] DAA / MAA.
          [Context] Measures how ingrained the product is in your customer base's daily operations.

      # --- USER TRENDS (Velocity) ---
      - name: dau_trend_7d
        description: >
          [Definition] 7-Day Velocity for DAU.
          [Formula] (Current DAU - DAU 7 Days Ago) / 7.
          [Context] Represents the average net new daily users gained (or lost) per day over the last week.
      - name: dau_trend_14d
        description: >
          [Definition] 14-Day Velocity for DAU.
          [Formula] (Current DAU - DAU 14 Days Ago) / 14.
          [Context] Represents the average net new daily users gained (or lost) per day over the last two weeks.
      - name: dau_trend_30d
        description: >
          [Definition] 30-Day Velocity for DAU.
          [Formula] (Current DAU - DAU 30 Days Ago) / 30.
          [Context] Represents the average net new daily users gained (or lost) per day over the last month.

      - name: wau_trend_7d
        description: >
          [Definition] 7-Day Velocity for WAU.
          [Formula] (Current WAU - WAU 7 Days Ago) / 7.
          [Context] Short-term momentum for weekly active users.
      - name: wau_trend_14d
        description: >
          [Definition] 14-Day Velocity for WAU.
          [Formula] (Current WAU - WAU 14 Days Ago) / 14.
          [Context] Medium-term momentum for weekly active users.
      - name: wau_trend_30d
        description: >
          [Definition] 30-Day Velocity for WAU.
          [Formula] (Current WAU - WAU 30 Days Ago) / 30.
          [Context] Long-term momentum for weekly active users.

      - name: mau_trend_7d
        description: >
          [Definition] 7-Day Velocity for MAU.
          [Formula] (Current MAU - MAU 7 Days Ago) / 7.
          [Context] Short-term momentum for monthly active users.
      - name: mau_trend_14d
        description: >
          [Definition] 14-Day Velocity for MAU.
          [Formula] (Current MAU - MAU 14 Days Ago) / 14.
          [Context] Medium-term momentum for monthly active users.
      - name: mau_trend_30d
        description: >
          [Definition] 30-Day Velocity for MAU.
          [Formula] (Current MAU - MAU 30 Days Ago) / 30.
          [Context] Net new users/day over last month. Positive means the user base is growing.

      # --- ACCOUNT TRENDS (Velocity) ---
      - name: daa_trend_7d
        description: >
          [Definition] 7-Day Velocity for DAA.
          [Formula] (Current DAA - DAA 7 Days Ago) / 7.
          [Context] Measures short-term spikes in account activity.
      - name: daa_trend_14d
        description: >
          [Definition] 14-Day Velocity for DAA.
          [Formula] (Current DAA - DAA 14 Days Ago) / 14.
          [Context] Measures medium-term trends in account activity.
      - name: daa_trend_30d
        description: >
          [Definition] 30-Day Velocity for DAA.
          [Formula] (Current DAA - DAA 30 Days Ago) / 30.
          [Context] Measures long-term trends in account activity.

      - name: waa_trend_7d
        description: >
          [Definition] 7-Day Velocity for WAA.
          [Formula] (Current WAA - WAA 7 Days Ago) / 7.
          [Context] Short-term momentum for weekly active accounts.
      - name: waa_trend_14d
        description: >
          [Definition] 14-Day Velocity for WAA.
          [Formula] (Current WAA - WAA 14 Days Ago) / 14.
          [Context] Medium-term momentum for weekly active accounts.
      - name: waa_trend_30d
        description: >
          [Definition] 30-Day Velocity for WAA.
          [Formula] (Current WAA - WAA 30 Days Ago) / 30.
          [Context] Long-term momentum for weekly active accounts.

      - name: maa_trend_7d
        description: >
          [Definition] 7-Day Velocity for MAA.
          [Formula] (Current MAA - MAA 7 Days Ago) / 7.
          [Context] Short-term momentum for total customer base.
      - name: maa_trend_14d
        description: >
          [Definition] 14-Day Velocity for MAA.
          [Formula] (Current MAA - MAA 14 Days Ago) / 14.
          [Context] Medium-term momentum for total customer base.
      - name: maa_trend_30d
        description: >
          [Definition] 30-Day Velocity for MAA.
          [Formula] (Current MAA - MAA 30 Days Ago) / 30.
          [Context] Net new accounts/day over last month. Positive means the customer base is growing.

  - name: fct_account_metrics_daily
    description: >
      [Definition] The central fact table containing daily account-level product usage metrics.
      Each row represents a single Account (Company) on a single Date.
      [Context] Use this table to analyze trends over time, such as daily active usage,
      account stickiness, and dormancy risks. This is the primary source for PLG signals.
    columns:
      - name: metric_date
        description: >
          [Definition] The calendar date for the metrics.
          [Formula] Derived from Date Spine.
          [Context] Indicates the date of observation.
        tests: [not_null]

      - name: account_id
        description: >
          [Definition] The unique identifier for the Account (Group).
          [Formula] From source `context_group_id`.
          [Context] Identifies the specific customer or company.
        tests: [not_null]

      # --- CORE METRICS ---
      - name: dau
        description: >
          [Definition] Daily Active Users (Account Level).
          [Formula] COUNT(DISTINCT user_id) within this account on metric_date.
          [Context] Count of unique users active in this account today.

      - name: wau
        description: >
          [Definition] Weekly Active Users (Account Level).
          [Formula] COUNT(DISTINCT user_id) within this account in last 7 days.
          [Context] Count of unique users active in this account over the last 7 days.

      - name: mau
        description: >
          [Definition] Monthly Active Users (Account Level).
          [Formula] COUNT(DISTINCT user_id) within this account in last 30 days.
          [Context] Count of unique users active in this account over the last 30 days.

      # --- VOLUME & DEPTH ---
      - name: n_events_daily
        description: >
          [Definition] Total events performed by this account today.
          [Formula] COUNT(*) from daily activity where activity_date = metric_date.
          [Context] Approximation of daily volume. Higher volume = higher engagement.

      - name: distinct_features_used_30d
        description: >
          [Definition] Feature Breadth (Product Depth).
          [Formula] COUNT(DISTINCT event_name) within this account in last 30 days.
          [Context] Proxy for how deeply the account is using the product. More features = stickier customer.

      - name: active_days_7d
        description: >
          [Definition] Number of days active in the last 7 days.
          [Formula] COUNT(DISTINCT activity_date) where activity_date > metric_date - 7 days.
          [Context] Frequency indicator. 5-7 days = highly engaged.

      - name: active_days_30d
        description: >
          [Definition] Number of days active in the last 30 days.
          [Formula] COUNT(DISTINCT activity_date) where activity_date > metric_date - 30 days.
          [Context] Frequency indicator. Used in stickiness ratio calculation.

      # --- SESSION METRICS ---
      - name: n_sessions_daily
        description: >
          [Definition] Number of sessions on this date.
          [Formula] COUNT(*) from fct_sessions where session_start_at date = metric_date.
          [Context] Measures daily session volume for the account.

      - name: time_on_platform_minutes_daily
        description: >
          [Definition] Total time spent on platform on this date in minutes.
          [Formula] SUM(session_duration_seconds) / 60 where session_start_at date = metric_date.
          [Context] Measures daily engagement depth. Higher values indicate more time invested.

      - name: n_sessions_7d
        description: >
          [Definition] Total sessions in last 7 days.
          [Formula] COUNT(*) from fct_sessions where session_start_at date > metric_date - 7 days.
          [Context] Short-term session frequency indicator.

      - name: time_on_platform_minutes_7d
        description: >
          [Definition] Total time on platform in last 7 days in minutes.
          [Formula] SUM(session_duration_seconds) / 60 over 7 day window.
          [Context] Weekly engagement depth. Useful for detecting usage drops.

      - name: n_sessions_30d
        description: >
          [Definition] Total sessions in last 30 days.
          [Formula] COUNT(*) from fct_sessions where session_start_at date > metric_date - 30 days.
          [Context] Monthly session frequency. Power accounts have higher values.

      - name: time_on_platform_minutes_30d
        description: >
          [Definition] Total time on platform in last 30 days in minutes.
          [Formula] SUM(session_duration_seconds) / 60 over 30 day window.
          [Context] Monthly engagement depth. Key indicator of product stickiness.

      - name: avg_daily_sessions_7d
        description: >
          [Definition] Average sessions per active day (7-day window).
          [Formula] n_sessions_7d / active_days_7d.
          [Context] Measures session intensity. Multiple sessions per day indicates high engagement.

      - name: avg_daily_sessions_30d
        description: >
          [Definition] Average sessions per active day (30-day window).
          [Formula] n_sessions_30d / active_days_30d.
          [Context] Measures sustained session intensity over monthly period.

      - name: avg_daily_time_on_platform_minutes_7d
        description: >
          [Definition] Average time on platform per active day in minutes (7-day window).
          [Formula] time_on_platform_minutes_7d / active_days_7d.
          [Context] Daily engagement intensity. Higher values indicate deeper product usage.

      - name: avg_daily_time_on_platform_minutes_30d
        description: >
          [Definition] Average time on platform per active day in minutes (30-day window).
          [Formula] time_on_platform_minutes_30d / active_days_30d.
          [Context] Sustained daily engagement depth over monthly period.

      # --- FLAGS ---
      - name: is_active_daily
        description: >
          [Definition] Daily Activity Flag.
          [Formula] 1 if DAU > 0, else 0.
          [Context] Binary indicator if the account did anything today.
      - name: is_active_weekly
        description: >
          [Definition] Weekly Activity Flag.
          [Formula] 1 if WAU > 0, else 0.
          [Context] Binary indicator if the account was active this week.
      - name: is_active_monthly
        description: >
          [Definition] Monthly Activity Flag.
          [Formula] 1 if MAU > 0, else 0.
          [Context] Binary indicator if the account is retained (active this month).

      # --- GTM SIGNALS ---
      - name: net_new_users_7d
        description: >
          [Definition] Weekly Seat Velocity (Expansion Signal).
          [Formula] Current WAU - WAU 7 Days Ago.
          [Context] Positive values indicate seat expansion within this account. Key signal for upsell opportunity.

      - name: volume_change_ratio_7d
        description: >
          [Definition] Usage Contraction Signal (Churn Warning).
          [Formula] (Sum of events last 7 days) / (Sum of events prior 7 days).
          [Context] <1.0 means usage is declining. <0.5 is a strong churn signal.

      # --- RATIOS ---
      - name: account_stickiness_ratio
        description: >
          [Definition] Account Usage Frequency.
          [Formula] active_days_7d / active_days_30d.
          [Context] Measures consistency. 1.0 = Uses product every day. <0.15 = Churn Risk.
      - name: user_stickiness_ratio
        description: >
          [Definition] User Depth.
          [Formula] Account DAU / Account MAU.
          [Context] Measures how habit-forming the product is for users within this specific company.
      - name: is_dormant_risk
        description: >
          [Definition] Churn Risk Signal.
          [Formula] 1 if MAU > 0 AND WAU = 0.
          [Context] Account was active recently but stopped using the product this week. Immediate attention needed.

      # --- TRENDS ---
      - name: dau_trend_7d
        description: >
          [Definition] 7-Day Velocity for DAU (Account Level).
          [Formula] (Current DAU - DAU 7 Days Ago) / 7.
          [Context] Short-term trend in daily active users for this account.
      - name: dau_trend_14d
        description: >
          [Definition] 14-Day Velocity for DAU (Account Level).
          [Formula] (Current DAU - DAU 14 Days Ago) / 14.
          [Context] Medium-term trend in daily active users for this account.
      - name: dau_trend_30d
        description: >
          [Definition] 30-Day Velocity for DAU (Account Level).
          [Formula] (Current DAU - DAU 30 Days Ago) / 30.
          [Context] Long-term trend in daily active users for this account.

      - name: wau_trend_7d
        description: >
          [Definition] 7-Day Velocity for WAU (Account Level).
          [Formula] (Current WAU - WAU 7 Days Ago) / 7.
          [Context] Short-term trend in weekly active users for this account.
      - name: wau_trend_14d
        description: >
          [Definition] 14-Day Velocity for WAU (Account Level).
          [Formula] (Current WAU - WAU 14 Days Ago) / 14.
          [Context] Medium-term trend in weekly active users for this account.
      - name: wau_trend_30d
        description: >
          [Definition] 30-Day Velocity for WAU (Account Level).
          [Formula] (Current WAU - WAU 30 Days Ago) / 30.
          [Context] Long-term trend in weekly active users for this account.

      - name: mau_trend_7d
        description: >
          [Definition] 7-Day Velocity for MAU (Account Level).
          [Formula] (Current MAU - MAU 7 Days Ago) / 7.
          [Context] Short-term trend in monthly active users for this account.
      - name: mau_trend_14d
        description: >
          [Definition] 14-Day Velocity for MAU (Account Level).
          [Formula] (Current MAU - MAU 14 Days Ago) / 14.
          [Context] Medium-term trend in monthly active users for this account.
      - name: mau_trend_30d
        description: >
          [Definition] 30-Day Velocity for MAU (Account Level).
          [Formula] (Current MAU - MAU 30 Days Ago) / 30.
          [Context] Net new active users gained/lost per day in this account over the last month.

  - name: fct_user_metrics_daily
    description: >
      [Definition] A Snapshot table containing the LATEST metrics for every individual user (Human).
      [Context] Use this table to analyze current user retention status (New vs Resurrected vs Churned).
      One row per unique User ID (Snapshot).
    columns:
      - name: metric_date
        description: >
          [Definition] The calendar date of the snapshot.
          [Formula] The latest date available in the dataset for this user.
          [Context] Indicates when these metrics were last calculated.
        tests: [not_null]

      - name: user_id
        description: >
          [Definition] Unique User ID.
          [Formula] From source `user_id`.
          [Context] The unique identifier for the individual user.
        tests: [not_null]

      - name: latest_account_id
        description: >
          [Definition] The most recent Account ID associated with this user.
          [Formula] Joined from `dim_users`.
          [Context] Connects this user to their primary organization.

      - name: n_events_daily
        description: >
          [Definition] Number of events performed on the snapshot date.
          [Formula] Count(*) from tracks.
          [Context] Usage volume intensity.

      - name: is_active_daily
        description: >
          [Definition] Daily Activity Flag.
          [Formula] 1 if n_events_daily > 0, else 0.
          [Context] Binary indicator if the user was active on the snapshot date.

      - name: is_active_weekly
        description: >
          [Definition] Weekly Activity Flag.
          [Formula] 1 if user was active in last 7 days from snapshot.
          [Context] Binary indicator if the user is currently a weekly active user (WAU).

      - name: is_active_monthly
        description: >
          [Definition] Monthly Activity Flag.
          [Formula] 1 if user was active in last 30 days from snapshot.
          [Context] Binary indicator if the user is currently a monthly active user (MAU).

      - name: active_days_last_7
        description: >
          [Definition] Frequency. Days active in last 7.
          [Formula] SUM(is_active_daily) over 7 day window.
          [Context] 3+ indicates a "Power User" for most B2B apps.

      - name: active_days_last_14
        description: >
          [Definition] Days active in last 14 days.
          [Formula] SUM(is_active_daily) over 14 day window.
          [Context] Champion Metric. 10+ days in L14 = highly engaged power user.

      - name: n_events_monthly
        description: >
          [Definition] Total events performed by this user in the last 30 days.
          [Formula] SUM(n_events_daily) over 30 day window.
          [Context] Measures overall usage volume. Used to rank users within accounts.

      - name: n_sessions_daily
        description: >
          [Definition] Number of sessions started on this day.
          [Formula] COUNT(*) from fct_sessions where session_start_at date = metric_date.
          [Context] Measures how many distinct usage sessions the user had today.

      - name: n_sessions_monthly
        description: >
          [Definition] Total sessions in the last 30 days.
          [Formula] SUM(n_sessions_daily) over 30 day window.
          [Context] Higher session counts indicate more frequent product engagement.

      - name: avg_session_duration_minutes_monthly
        description: >
          [Definition] Average session length in minutes over last 30 days.
          [Formula] AVG(session_duration_seconds / 60) over 30 day window.
          [Context] Longer sessions typically indicate deeper engagement. Consider product type when interpreting.

      - name: avg_session_length_monthly
        description: >
          [Definition] Average number of events per session over last 30 days.
          [Formula] AVG(events_in_session) over 30 day window.
          [Context] More events per session indicates higher intensity usage. Power users have higher values.

      # --- GTM SIGNALS ---
      - name: usage_rank_in_account
        description: >
          [Definition] User's rank within their account based on usage volume.
          [Formula] ROW_NUMBER() OVER (PARTITION BY account_id, metric_date ORDER BY n_events_monthly DESC).
          [Context] Rank 1 = Champion user. Target for customer success engagement.

      - name: is_admin_proxy
        description: >
          [Definition] Proxy indicator for admin or buyer persona.
          [Formula] 1 if user's first_seen_at = account's first_seen_at, else 0.
          [Context] First user in an account is likely the buyer/admin. Key contact for renewals.

      - name: distinct_features_used_30d
        description: >
          [Definition] Feature Sophistication Score.
          [Formula] COUNT(DISTINCT event_name) in last 30 days.
          [Context] Measures product depth. Higher = more sophisticated user.

      - name: user_lifecycle_status
        description: >
          [Definition] Current Lifecycle State.
          [Formula] Logic based on history: New, Active, Dormant, Resurrected, Churned.
          [Context] Critical for "Growth Accounting" and understanding net user growth.

  - name: fct_sessions
    description: >
      [Definition] Sessionized event data table containing one row per user session.
      A session is a sequence of events by the same user with no more than 30 minutes (configurable) of inactivity between events.
      [Context] Use this table to analyze session-level patterns like session duration, events per session, and session frequency.
      Materialized incrementally with partitioning for cost efficiency.
    tests:
      # Ensure no negative durations
      - dbt_utils.expression_is_true:
          arguments:
            expression: "session_duration_seconds >= 0"
          config:
            severity: error

      # Ensure session_end_at >= session_start_at
      - dbt_utils.expression_is_true:
          arguments:
            expression: "session_end_at >= session_start_at"
          config:
            severity: error

      # Ensure events_in_session is at least 1
      - dbt_utils.expression_is_true:
          arguments:
            expression: "events_in_session >= 1"
          config:
            severity: error
    columns:
      - name: session_id
        tests: [unique, not_null]
        description: >
          [Definition] Unique identifier for each session.
          [Formula] Surrogate key generated from user_id and user_session_index.
          [Context] Primary key for the sessions table.

      - name: user_id
        tests: [not_null]
        description: >
          [Definition] Unique User ID.
          [Formula] From stg_segment_tracks.
          [Context] Links sessions back to individual users.

      - name: account_id
        tests: [not_null]
        description: >
          [Definition] Unique Account ID.
          [Formula] From stg_segment_tracks.
          [Context] Links sessions to accounts/companies. Used for account-level session aggregation.

      - name: session_start_at
        tests: [not_null]
        description: >
          [Definition] Timestamp when the session started.
          [Formula] MIN(event_at) within the session grouping.
          [Context] Used for time-based filtering and analysis. Table is partitioned by this field.

      - name: session_end_at
        tests: [not_null]
        description: >
          [Definition] Timestamp when the session ended.
          [Formula] MAX(event_at) within the session grouping.
          [Context] Used to calculate session duration and identify session boundaries.

      - name: session_duration_seconds
        description: >
          [Definition] Length of the session in seconds.
          [Formula] DATEDIFF(session_end_at, session_start_at, 'second').
          [Context] Single-event sessions have duration of 0. Longer durations indicate sustained engagement.

      - name: events_in_session
        description: >
          [Definition] Number of events that occurred in this session.
          [Formula] COUNT(*) within the session grouping.
          [Context] Higher counts indicate more intensive usage. Power users have more events per session.

  - name: dim_accounts
    description: >
      [Definition] Master dimension table containing one row per unique account (company/organization).
      [Context] Use this table to understand account lifecycle, size, and activity patterns. Join to fact tables for account-level analysis.
    columns:
      - name: account_id
        tests: [unique, not_null]
        description: >
          [Definition] Unique Account ID.
          [Formula] From source `context_group_id`.
          [Context] Primary Key for the account dimension.

      - name: first_seen_at
        description: >
          [Definition] Timestamp of first event.
          [Formula] MIN(event_at) for this account.
          [Context] Used to calculate Account Age.

      - name: last_seen_at
        description: >
          [Definition] Timestamp of most recent event.
          [Formula] MAX(event_at) for this account.
          [Context] Used to determine if an account has churned.

      - name: current_active_seats
        description: >
          [Definition] Proxy for active licenses.
          [Formula] COUNT(DISTINCT user_id) active in last 30 days.
          [Context] Indicates the number of currently active seats/licenses.

      - name: lifetime_unique_users
        description: >
          [Definition] Total distinct users ever seen.
          [Formula] COUNT(DISTINCT user_id) lifetime.
          [Context] Indicates total historical reach of the account.

      - name: days_since_first_seen
        description: >
          [Definition] Account Age in days.
          [Formula] DATEDIFF(day, first_seen_at, current_date).
          [Context] Useful for cohort analysis.

      - name: days_since_last_seen
        description: >
          [Definition] Days inactive.
          [Formula] DATEDIFF(day, last_seen_at, current_date).
          [Context] >30 days strongly suggests churn.

  - name: dim_users
    description: >
      [Definition] Master dimension table containing one row per unique user (individual human).
      [Context] Use this table to understand user lifecycle, tenure, and account associations. Join to fact tables for user-level analysis.
    columns:
      - name: user_id
        tests: [unique, not_null]
        description: >
          [Definition] Unique User ID.
          [Formula] From source `user_id`.
          [Context] Primary Key for the user dimension.
      - name: first_seen_at
        description: >
          [Definition] Timestamp of first event.
          [Formula] MIN(event_at) for this user.
          [Context] Used to calculate User Age.
      - name: last_seen_at
        description: >
          [Definition] Timestamp of most recent event.
          [Formula] MAX(event_at) for this user.
          [Context] Used to determine if a user has churned.
      - name: lifetime_accounts_distinct
        description: >
          [Definition] Number of unique accounts this user has engaged with.
          [Formula] COUNT(DISTINCT account_id) lifetime.
          [Context] High numbers may indicate a contractor or admin user.
      - name: latest_account_id
        description: >
          [Definition] The most recent Account ID associated with this user.
          [Formula] account_id from the most recent track event.
          [Context] Useful for mapping users to their current primary organization.

      - name: days_since_first_seen
        description: >
          [Definition] User tenure in days.
          [Formula] DATEDIFF(day, first_seen_at, current_timestamp).
          [Context] Used for user cohort analysis and understanding user lifecycle stage.

      - name: days_since_last_seen
        description: >
          [Definition] Days since user was last active.
          [Formula] DATEDIFF(day, last_seen_at, current_timestamp).
          [Context] Recency indicator. >30 days suggests the user may have churned.
