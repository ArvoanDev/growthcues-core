version: 2

models:
  - name: stg_tracks
    description: >
      Router model. Delegates to stg_segment_tracks or stg_posthog_tracks based on
      var('tracking_provider', 'segment'). All downstream marts reference this model
      so that switching providers requires only a single variable change.
    columns:
      - name: event_id
        description: Unique identifier for the event
        tests:
          - not_null
          - unique
      - name: user_id
        description: Resolved user identifier
      - name: account_id
        description: Account/group identifier
      - name: event_name
        description: Name of the event
        tests:
          - not_null
      - name: event_at
        description: Timestamp when the event occurred
        tests:
          - not_null

  - name: stg_pages
    description: >
      Router model. Delegates to stg_segment_pages or stg_posthog_pages based on
      var('tracking_provider', 'segment'). Only materialized when
      var('include_pages_in_sessions') is true.

  - name: stg_segment_tracks
    description: >
      Staging model for Segment track events. Transforms raw event data
      with optional identity stitching and standardized column names.
    columns:
      - name: event_id
        description: Unique identifier for the event
        tests:
          - not_null
          - unique
      - name: user_id
        description: User identifier from the event
      - name: account_id
        description: Account/group identifier from the event
      - name: event_name
        description: Name of the event that occurred
        tests:
          - not_null
      - name: event_at
        description: Timestamp when the event occurred
        tests:
          - not_null

  - name: stg_posthog_tracks
    description: >
      Staging model for PostHog track events (via Batch Exports). Filters out
      $pageview and $identify events, maps the single-table schema to standard
      GrowthCues columns, and extracts account_id from the $groups JSON property.
      Only enabled when var('tracking_provider') = 'posthog'.
    columns:
      - name: event_id
        description: Unique event identifier (PostHog uuid)
        tests:
          - not_null
          - unique
      - name: user_id
        description: Resolved user identity (PostHog distinct_id)
      - name: account_id
        description: >
          Account identifier extracted from properties.$groups.<posthog_group_type>
      - name: event_name
        description: Name of the PostHog event
        tests:
          - not_null
      - name: event_at
        description: Event timestamp
        tests:
          - not_null

  - name: stg_posthog_pages
    description: >
      Staging model for PostHog pageview events (via Batch Exports). Filters to
      $pageview events only, extracts URL/path/referrer from the JSON properties blob,
      and maps account_id from $groups. Only enabled when
      var('tracking_provider') = 'posthog' and var('include_pages_in_sessions') = true.

  - name: stg_identity_resolution
    description: >
      Maps anonymous IDs to their most recent user IDs for identity stitching.
      Uses last-touch attribution: if an anonymous_id is associated with multiple user_ids,
      the most recent user_id (by timestamp) wins.

      Note: This model is only enabled when var('enable_identity_stitching') is true.
    columns:
      - name: anonymous_id
        description: The anonymous identifier (e.g., cookie, device ID)
        tests:
          - not_null
          - unique
      - name: master_user_id
        description: The most recent user_id associated with this anonymous_id
        tests:
          - not_null

# Note: Unit tests for stg_segment_tracks are not included here because
# the model uses adapter.get_columns_in_relation() to introspect the source schema,
# which is not compatible with unit testing framework.
#
# Instead, test this model using integration tests with seeds:
# 1. dbt seed --target dev
# 2. dbt build --select stg_segment_tracks --target dev
# 3. dbt test --select stg_segment_tracks --target dev

# Note: Unit tests for stg_identity_resolution are not included here because
# the model uses dbt.dateadd() and dbt.current_timestamp() in WHERE clauses,
# which are not properly handled by the unit test framework's compilation context.
#
# Instead, test this model using integration tests with seeds:
# 1. dbt seed --target dev (includes identifies.csv with identity mappings)
# 2. dbt build --select stg_identity_resolution --target dev
# 3. dbt test --select stg_identity_resolution --target dev
#
# The integration tests with seeds will validate:
# - Last-touch attribution (most recent user_id wins for each anonymous_id)
# - Filtering of null user_ids
# - Multiple identity mappings over time
