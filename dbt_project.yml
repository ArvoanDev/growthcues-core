name: "growthcues_core"
version: "1.0.0"
config-version: 2

profile: "growthcues_core"

model-paths: ["models"]
analysis-paths: ["analyses"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]

target-path: "target" # directory which will store compiled SQL files
clean-targets: # directories to be removed by 'dbt clean'
  - "target"
  - "dbt_packages"

vars:
  # Session configuration
  session_timeout_minutes: 30 # Session timeout duration in minutes
  include_pages_in_sessions: true # Set to true to include page views in session calculation

  # Identity stitching configuration
  enable_identity_stitching: true # Set to false to disable identity stitching (if you don't have anonymous users or identifies table)
  identity_anonymous_id_field: "anonymous_id" # Field name for anonymous ID in identity stitching; e.g., anonymous_id (snake_case), anonymousId (camelCase/Segment default), visitor_id, device_id
  identity_lookback_days: 365 # Number of days to look back for identity resolution data

  # Data lookback windows
  tracks_lookback_days: 365 # Number of days to look back for tracks/events data
  pages_lookback_days: 365 # Number of days to look back for pages data

  # Account/Group ID field mapping
  group_id: "context_group_id" # Group ID (account_id) field in Segment data; by default, Segment stores this in 'context_group_id' if following standard conventions (B2B Spec)

  # Source configuration (override these in your dbt_project.yml when using as a package)
  # segment_database: "YOUR_DATABASE"  # Defaults to target.database if not specified

  # For local dev with DuckDB seeds, point to 'main' schema where seeds are loaded
  # For production, override to your actual schema: segment_schema: "segment_events"
  segment_schema: "main"

  # Table names follow standard Segment naming convention (tracks, pages, identifies, users, groups)
  # No need to override these - seed files are named to match production table names
models:
  growthcues_core:
    # Config for all models in the project
    +persist_docs:
      relation: true
      columns: true
    staging:
      +materialized: view
    marts:
      +materialized: table
