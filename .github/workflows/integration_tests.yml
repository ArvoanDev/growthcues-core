name: Integration Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test-snowflake:
    runs-on: ubuntu-latest
    if: vars.SNOWFLAKE_ACCOUNT != ''

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.10"

      - name: Install dbt-snowflake
        run: pip install dbt-snowflake

      - name: Setup dbt profile
        run: |
          mkdir -p ~/.dbt
          cat > ~/.dbt/profiles.yml <<EOF
          integration_tests:
            target: snowflake
            outputs:
              snowflake:
                type: snowflake
                account: ${{ secrets.SNOWFLAKE_ACCOUNT }}
                user: ${{ secrets.SNOWFLAKE_USER }}
                password: ${{ secrets.SNOWFLAKE_PASSWORD }}
                role: ${{ secrets.SNOWFLAKE_ROLE }}
                database: ${{ secrets.SNOWFLAKE_DATABASE }}
                warehouse: ${{ secrets.SNOWFLAKE_WAREHOUSE }}
                schema: dbt_integration_tests_${{ github.run_id }}
                threads: 4
          EOF

      - name: Install dependencies
        run: |
          cd integration_tests
          dbt deps

      - name: Load seed data
        run: |
          cd integration_tests
          dbt seed

      - name: Run models
        run: |
          cd integration_tests
          dbt run

      - name: Run tests
        run: |
          cd integration_tests
          dbt test

  test-snowflake-posthog:
    runs-on: ubuntu-latest
    if: vars.SNOWFLAKE_ACCOUNT != ''

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.10"

      - name: Install dbt-snowflake
        run: pip install dbt-snowflake

      - name: Setup dbt profile
        run: |
          mkdir -p ~/.dbt
          cat > ~/.dbt/profiles.yml <<EOF
          integration_tests:
            target: snowflake
            outputs:
              snowflake:
                type: snowflake
                account: ${{ secrets.SNOWFLAKE_ACCOUNT }}
                user: ${{ secrets.SNOWFLAKE_USER }}
                password: ${{ secrets.SNOWFLAKE_PASSWORD }}
                role: ${{ secrets.SNOWFLAKE_ROLE }}
                database: ${{ secrets.SNOWFLAKE_DATABASE }}
                warehouse: ${{ secrets.SNOWFLAKE_WAREHOUSE }}
                schema: dbt_integration_tests_posthog_${{ github.run_id }}
                threads: 4
          EOF

      - name: Install dependencies
        run: |
          cd integration_tests
          dbt deps

      - name: Load seed data
        run: |
          cd integration_tests
          dbt seed

      - name: Run models (PostHog provider)
        run: |
          cd integration_tests
          dbt run --vars '{"tracking_provider": "posthog", "enable_identity_stitching": false}'

      - name: Run tests (PostHog provider)
        run: |
          cd integration_tests
          dbt test --vars '{"tracking_provider": "posthog", "enable_identity_stitching": false}'

  test-bigquery:
    runs-on: ubuntu-latest
    if: vars.GCP_PROJECT_ID != ''

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.10"

      - name: Install dbt-bigquery
        run: pip install dbt-bigquery

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v1
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Setup dbt profile
        run: |
          mkdir -p ~/.dbt
          cat > ~/.dbt/profiles.yml <<EOF
          integration_tests:
            target: bigquery
            outputs:
              bigquery:
                type: bigquery
                method: service-account
                project: ${{ secrets.GCP_PROJECT_ID }}
                dataset: dbt_integration_tests_${{ github.run_id }}
                threads: 4
                keyfile: ${{ env.GOOGLE_APPLICATION_CREDENTIALS }}
          EOF

      - name: Install dependencies
        run: |
          cd integration_tests
          dbt deps

      - name: Load seed data
        run: |
          cd integration_tests
          dbt seed

      - name: Run models
        run: |
          cd integration_tests
          dbt run

      - name: Run tests
        run: |
          cd integration_tests
          dbt test

  test-bigquery-posthog:
    runs-on: ubuntu-latest
    if: vars.GCP_PROJECT_ID != ''

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.10"

      - name: Install dbt-bigquery
        run: pip install dbt-bigquery

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v1
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Setup dbt profile
        run: |
          mkdir -p ~/.dbt
          cat > ~/.dbt/profiles.yml <<EOF
          integration_tests:
            target: bigquery
            outputs:
              bigquery:
                type: bigquery
                method: service-account
                project: ${{ secrets.GCP_PROJECT_ID }}
                dataset: dbt_integration_tests_posthog_${{ github.run_id }}
                threads: 4
                keyfile: ${{ env.GOOGLE_APPLICATION_CREDENTIALS }}
          EOF

      - name: Install dependencies
        run: |
          cd integration_tests
          dbt deps

      - name: Load seed data
        run: |
          cd integration_tests
          dbt seed

      - name: Run models (PostHog provider)
        run: |
          cd integration_tests
          dbt run --vars '{"tracking_provider": "posthog", "enable_identity_stitching": false}'

      - name: Run tests (PostHog provider)
        run: |
          cd integration_tests
          dbt test --vars '{"tracking_provider": "posthog", "enable_identity_stitching": false}'
